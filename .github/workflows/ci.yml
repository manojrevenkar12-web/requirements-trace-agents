name: ci
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements.txt ruff
      - run: ruff check rta tests --select E,F,W,I
      - run: python -m pytest -q
      - run: python -m rta.eval.cli readme --check
  evaluation:
    # all four designs on the dev world; the gate must hold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements.txt
      - run: python -m rta.eval.cli evaluate
      - run: python -m rta.eval.cli gate
      - run: git diff --exit-code reports/dev.json
  dashboard:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
